# Merge gate. `all-checks-passed` is the only required status check (engineering-baseline §5).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Format, detekt (with type resolution), detekt canary, Android lint
        run: ./gradlew spotlessCheck detektMain detektTest verifyDetektCanary :app:lintDebug :privileged:lintDebug --continue
      - name: start-helper.sh against a fake adb
        run: bash scripts/test/start-helper-test.sh
      - name: protocol-base-ref.sh against throwaway git repositories
        run: bash scripts/test/protocol-base-ref-test.sh
      - name: Secret scan
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --no-banner --verbose
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-reports
          path: |
            **/build/reports/detekt/
            **/build/reports/lint-results-*.html
          retention-days: 7

  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: core tests + coverage gates, build-logic tests
        run: ./gradlew :core:test :core:koverVerify :core:koverVerifyCritical :core:koverXmlReport :build-logic:convention:check --continue
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-reports
          path: |
            core/build/reports/
            build-logic/convention/build/reports/tests/
          retention-days: 7

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Cache Robolectric android-all jars
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-
      # The release unit tests run only the release checks (src/testRelease: no debug-only entry
      # point ships, see the app convention's filter); every other test runs on debug. The local
      # `check` runs both already.
      - name: Assemble debug APK + Robolectric unit tests (debug and release)
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:testReleaseUnitTest --continue
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-reports
          path: app/build/reports/
          retention-days: 7

  privileged-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # verifyPrivilegedProtocol reads protocol-history.txt at the base commit
          # Also makes protocol-base-ref.sh fetch a missing base anonymously: a private repo needs a token there.
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Cache Robolectric android-all jars
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-
      # verifyPrivilegedProtocol (engineering-baseline §6): changing the AIDL without bumping
      # PrivilegedProtocol.VERSION fails, changing transactions 1-4 fails, and against the base commit
      # privileged/protocol-history.txt may only grow (that part runs only here, with the base sha).
      - name: AIDL ⇄ PrivilegedProtocol.VERSION, assemble and unit-test the privileged helper
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          args=(:privileged:verifyPrivilegedProtocol :privileged:assembleDebug :privileged:testDebugUnitTest --continue)
          # Pushes run on main only. BASE_SHA is empty for workflow_dispatch and all zeros for the first
          # push of main: no baseline then. A base missing from the clone (force-pushed away) is fetched
          # by sha; if that fails the job fails rather than checking against an empty baseline.
          base_ref="$(bash scripts/ci/protocol-base-ref.sh)" || exit 1
          if [[ -n "$base_ref" ]]; then args+=("$base_ref"); fi
          ./gradlew "${args[@]}"
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: privileged-reports
          path: privileged/build/reports/
          retention-days: 7

  all-checks-passed:
    if: always()
    needs: [static, core, app, privileged-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed (failure, cancelled and skipped all fail)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null
