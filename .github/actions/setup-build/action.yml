name: Set up build
description: JDK 25 (matches gradle/gradle-daemon-jvm.properties) and Gradle with caching.
runs:
  using: composite
  steps:
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: "25"
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        # PRs read the cache but never write it; only main populates it.
        cache-read-only: ${{ github.event_name == 'pull_request' }}
