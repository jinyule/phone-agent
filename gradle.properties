# Single source of truth for the app version (docs/design/engineering-baseline.md §6).
# versionCode is derived from it by build-logic (Versioning.kt); do not set it anywhere else.
phoneagent.versionName=0.1.0-alpha.1

org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

android.useAndroidX=true
